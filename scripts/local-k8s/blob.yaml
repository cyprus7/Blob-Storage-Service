apiVersion: v1
kind: Service
metadata:
  name: blob-service
spec:
  selector:
    app: blob-smoke-service
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blob-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blob-smoke-service
  template:
    metadata:
      labels:
        app: blob-smoke-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: blob-service
          image: __BLOB_IMAGE__
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3100"
            - name: BLOB_PG_URL
              valueFrom:
                secretKeyRef:
                  name: blob-smoke-secrets
                  key: BLOB_PG_URL
            - name: BLOB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-smoke-secrets
                  key: BLOB_API_KEY
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: blobs
            - name: S3_ACCESS_KEY
              value: blobminio
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-smoke-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
