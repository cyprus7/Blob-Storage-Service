apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/apply-migrations.sh"]
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_USER
              value: blob_user
            - name: POSTGRES_DB
              value: blob_service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-secrets
                  key: POSTGRES_PASSWORD
            - name: MIGRATIONS_DIR
              value: /migrations
          volumeMounts:
            - name: runner
              mountPath: /scripts
              readOnly: true
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: runner
          configMap:
            name: migration-runner
        - name: migrations
          configMap:
            name: __CONFIGMAP_NAME__
