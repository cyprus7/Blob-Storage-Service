apiVersion: batch/v1
kind: Job
metadata:
  name: blob-migration
spec:
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for file in /migrations/*.sql; do
                psql -h postgres -U blob_user -d blob_service -v ON_ERROR_STOP=1 -f "$file"
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: blob-smoke-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: blob-migrations
