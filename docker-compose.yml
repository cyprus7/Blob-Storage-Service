services:
  postgres:
    image: postgres:17
    env_file:
      - .env.local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # check the configured database (POSTGRES_DB) instead of defaulting to username
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data
    env_file:
      - .env.local
    # Credentials are provided via .env.local (env_file) to avoid accidental substitution
    volumes:
      - miniodata:/data
    expose:
      - "9000"

  blob-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      # Map host port to the same port the service listens on inside the container.
      # Uses variable substitution; ensure `PORT` is defined in your shell or in a .env file.
      - "${PORT:-3100}:${PORT:-3100}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: on-failure

  migrate:
    image: postgres:17
    env_file:
      - .env.local
    environment:
      MIGRATIONS_DIR: /migrations/blob-service
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/apply-migrations.sh:/apply-migrations.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/apply-migrations.sh"]
    restart: "no"

volumes:
  pgdata:
  miniodata:

networks:
  default:
    driver: bridge
